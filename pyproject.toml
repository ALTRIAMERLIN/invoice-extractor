[project]
name = "invoice-extractor"
version = "0.1.0"
description = "Local PDF invoice extraction with evidence, review and safe spreadsheet exports"
requires-python = ">=3.11"
dependencies = ["streamlit==1.67.0", "pypdf==7.0.0", "openpyxl==3.1.5"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4", "reportlab==5.1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
